    <style>
      .paper{fill:#F2E9D8}.ink{fill:none;stroke:#174434;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.fine{fill:none;stroke:#174434;stroke-width:1.25;stroke-linecap:round;stroke-linejoin:round}.zone .wash{opacity:0;transition:opacity 900ms cubic-bezier(.2,.75,.25,1)}.zone .colour-line{opacity:.16;transition:opacity 700ms ease}.zone--hill .wash{fill:url(#hillWash)}.zone--coorg .wash{fill:url(#coorgWash)}.zone--kombu .wash{fill:#6c8a53}.zone--rose .wash{fill:url(#roseWash)}.zone--multi .wash{fill:url(#goldWash)}.zone--jamun .wash{fill:url(#jamunWash)}.zone--ginger .wash{fill:url(#gingerWash)}.zone--tulasi .wash{fill:url(#tulasiWash)}.colour-leaf{fill:#8B9B78;stroke:#174434;stroke-width:1.3}.colour-rose{fill:#D78C91;stroke:#8c4556;stroke-width:1.3}.colour-gold{fill:#d7ad43;stroke:#8b6328;stroke-width:1.3}.colour-purple{fill:#50305F;stroke:#352441;stroke-width:1.3}.colour-ginger{fill:#C2763B;stroke:#7f492e;stroke-width:1.3}.colour-river{fill:url(#river);stroke:#3e7e83;stroke-width:1.4}.zone .colour{opacity:0;transition:opacity 900ms ease}.active-hill .zone--hill .wash,.active-coorg .zone--coorg .wash,.active-kombu .zone--kombu .wash,.active-rose .zone--rose .wash,.active-multiflora .zone--multi .wash,.active-jamun .zone--jamun .wash,.active-ginger .zone--ginger .wash,.active-tulasi .zone--tulasi .wash{opacity:.87}.active-hill .zone--hill .colour,.active-coorg .zone--coorg .colour,.active-kombu .zone--kombu .colour,.active-rose .zone--rose .colour,.active-multiflora .zone--multi .colour,.active-jamun .zone--jamun .colour,.active-ginger .zone--ginger .colour,.active-tulasi .zone--tulasi .colour{opacity:1}.active-hill .zone--hill .colour-line,.active-coorg .zone--coorg .colour-line,.active-kombu .zone--kombu .colour-line,.active-rose .zone--rose .colour-line,.active-multiflora .zone--multi .colour-line,.active-jamun .zone--jamun .colour-line,.active-ginger .zone--ginger .colour-line,.active-tulasi .zone--tulasi .colour-line{opacity:.72}
    </style>
