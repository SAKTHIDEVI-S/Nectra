<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Nectra admin order dashboard.">
  <title>Nectra Order Desk</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
</head>
<body class="admin-page">
  <header class="admin-nav">
    <a class="wordmark" href="/" aria-label="Nectra storefront">NECTRA<small>Order Desk</small></a>
    <a class="text-link" href="/">Storefront <span>-></span></a>
  </header>

  <main class="admin-shell">
    <section class="admin-hero">
      <p class="eyebrow">Private dashboard</p>
      <h1>Orders, packed with care.</h1>
      <p>Review fresh checkouts, confirm payments, and move every jar through packing, shipping, and delivery.</p>
    </section>

    <section class="admin-panel" id="adminLoginPanel">
      <form id="adminLoginPage">
        <p class="eyebrow">Sign in</p>
        <label>Admin password<input id="adminPasswordPage" type="password" required autocomplete="current-password"></label>
        <button class="button gold full" type="submit">Open order desk <span>-></span></button>
        <p class="form-note" id="adminLoginNote"></p>
      </form>
    </section>

    <section class="admin-dashboard" id="adminDashboard" hidden>
      <div class="admin-toolbar">
        <div>
          <p class="eyebrow">Live orders</p>
          <h2>Nectra fulfilment</h2>
          <p id="orderCount" class="admin-muted"></p>
        </div>
        <div class="admin-actions">
          <button class="button" id="refreshOrders" type="button">Refresh <span>↻</span></button>
          <button class="button" id="logoutAdmin" type="button">Sign out <span>x</span></button>
        </div>
      </div>
      <div id="adminOrdersPage" class="orders-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
